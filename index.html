<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18 Steps Pantry & Spices Catalogue</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <img src="logo.png"
         alt="18 Steps Pantry & Spices"
         class="logo">

    <p class="subtitle">
        Product Catalogue
    </p>

    <input
        type="text"
        id="search"
        placeholder="Search products...">

    <table id="catalogue">

        <thead>
            <tr>
                <th>Product</th>
                <th>Pack Size</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
